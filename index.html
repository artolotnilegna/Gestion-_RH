
<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH - Gestion du Personnel</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;color:#172033}
header{background:#12345a;color:white;padding:22px 16px}
header h1{margin:0;font-size:23px}
header p{margin-bottom:0}
nav{display:flex;gap:8px;padding:12px;overflow:auto;background:white}
nav button{white-space:nowrap;border:0;padding:12px;border-radius:8px;background:#e2e8f0}
nav button.active{background:#12345a;color:white}
main{padding:14px;max-width:850px;margin:auto}
.panel{background:white;padding:16px;border-radius:12px;margin-bottom:15px}
h2{font-size:19px;margin-top:0}
input,select,button{font:inherit}
input,select{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #cbd5e1;border-radius:7px}
.action{background:#1769aa;color:white;border:0;padding:11px 15px;border-radius:7px}
.delete{background:#b91c1c;color:white;border:0;padding:6px;border-radius:5px}
.item{border-bottom:1px solid #e2e8f0;padding:12px 0;overflow-wrap:anywhere}
.small{font-size:13px;color:#64748b}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>RH | Gestion du Personnel</h1>
<p>Mpiasa · Pointage · Congé</p>
</header>
<nav>
<button class="active" data-tab="home">Accueil</button>
<button data-tab="employees">Mpiasa</button>
<button data-tab="attendance">Pointage</button>
<button data-tab="leave">Congé</button>
</nav>
<main>
<section id="home" class="panel">
<h2>Tableau de bord</h2>
<p>Fitantanana ny mpiasa sy ny fisiany.</p>
<div id="stats"></div>
<p class="small">Prototype: voatahiry amin'ity navigateur ity ihany ny angona.</p>
</section>

<section id="employees" hidden>
<div class="panel">
<h2>Manampy mpiasa</h2>
<form id="employeeForm">
<label>Matricule</label>
<input name="matricule" required>
<label>Anarana sy fanampiny</label>
<input name="name" required>
<label>Asa / Poste</label>
<input name="job" required>
<label>Sampana</label>
<input name="department">
<button class="action">Tehirizo ny mpiasa</button>
</form>
</div>
<div class="panel">
<h2>Lisitry ny mpiasa</h2>
<div id="employeeList"></div>
</div>
</section>

<section id="attendance" hidden>
<div class="panel">
<h2>Pointage isan'andro</h2>
<form id="attendanceForm">
<label>Mpiasa</label>
<select id="attEmployee" name="employee" required></select>
<label>Daty</label>
<input name="date" type="date" required>
<label>Ora fidirana</label>
<input name="in" type="time">
<label>Ora fivoahana</label>
<input name="out" type="time">
<label>Sata</label>
<select name="status">
<option>Présent</option>
<option>Absent</option>
<option>Congé</option>
<option>Repos</option>
</select>
<button class="action">Tehirizo ny pointage</button>
</form>
</div>
<div class="panel">
<h2>Pointage voatahiry</h2>
<div id="attendanceList"></div>
</div>
</section>

<section id="leave" hidden>
<div class="panel">
<h2>Fangatahana congé</h2>
<form id="leaveForm">
<label>Mpiasa</label>
<select id="leaveEmployee" name="employee" required></select>
<label>Daty fanombohana</label>
<input name="start" type="date" required>
<label>Daty fiafarana</label>
<input name="end" type="date" required>
<label>Antony</label>
<input name="reason" required>
<label>Sata</label>
<select name="status">
<option>En attente</option>
<option>Accepté</option>
<option>Refusé</option>
</select>
<button class="action">Tehirizo ny fangatahana</button>
</form>
</div>
<div class="panel">
<h2>Fangatahana voatahiry</h2>
<div id="leaveList"></div>
</div>
</section>
</main>
<script>
const key="rh-demo-v1";
let db;
try {
  db=JSON.parse(localStorage.getItem(key))||{
    employees:[],attendance:[],leaves:[]
  };
} catch(e) {
  db={employees:[],attendance:[],leaves:[]};
}
function save(){
  localStorage.setItem(key,JSON.stringify(db));
  render();
}
function el(id){return document.getElementById(id)}
function safe(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}
function options(id){
  const old=el(id).value;
  el(id).innerHTML='<option value="">-- Safidio ny mpiasa --</option>'+
    db.employees.map((p,i)=>
      `<option value="${i}">${safe(p.matricule)} - ${safe(p.name)}</option>`
    ).join("");
  if(old!=="" && db.employees[Number(old)]) el(id).value=old;
}
function render(){
  el("stats").innerHTML=
    `<p>Isan'ny mpiasa: <b>${db.employees.length}</b></p>`+
    `<p>Pointage voarakitra: <b>${db.attendance.length}</b></p>`+
    `<p>Fangatahana congé: <b>${db.leaves.length}</b></p>`;
  el("employeeList").innerHTML=db.employees.map((p,i)=>
    `<div class="item"><b>${safe(p.name)}</b><br>`+
    `${safe(p.matricule)} · ${safe(p.job)} · ${safe(p.department)}`+
    ` <button class="delete" onclick="removeEmployee(${i})">Fafana</button></div>`
  ).join("")||"Mbola tsy misy mpiasa.";
  el("attendanceList").innerHTML=db.attendance.map(p=>
    `<div class="item"><b>${safe(p.name)}</b> · ${safe(p.date)}<br>`+
    `Fidirana: ${safe(p.in||"-")} · Fivoahana: ${safe(p.out||"-")}<br>`+
    `${safe(p.status)}</div>`
  ).join("")||"Mbola tsy misy pointage.";
  el("leaveList").innerHTML=db.leaves.map(p=>
    `<div class="item"><b>${safe(p.name)}</b><br>`+
    `${safe(p.start)} → ${safe(p.end)}<br>`+
    `${safe(p.reason)} · <b>${safe(p.status)}</b></div>`
  ).join("")||"Mbola tsy misy fangatahana.";
  options("attEmployee");options("leaveEmployee");
}
function removeEmployee(i){
  if(confirm("Fafana ve ity mpiasa ity?")){
    db.employees.splice(i,1);save();
  }
}
document.querySelectorAll("[data-tab]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("main section").forEach(s=>s.hidden=true);
    el(b.dataset.tab).hidden=false;
    document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
  };
});
el("employeeForm").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target),p=Object.fromEntries(f);
  if(db.employees.some(x=>x.matricule===p.matricule)){
    alert("Efa misy io matricule io.");return;
  }
  db.employees.push(p);e.target.reset();save();
  alert("Voatahiry ny mpiasa.");
};
el("attendanceForm").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target),p=Object.fromEntries(f);
  p.name=db.employees[Number(p.employee)].name;
  delete p.employee;
  db.attendance.push(p);e.target.reset();save();
  alert("Voatahiry ny pointage.");
};
el("leaveForm").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target),p=Object.fromEntries(f);
  if(p.end<p.start){alert("Diso ny daty.");return;}
  p.name=db.employees[Number(p.employee)].name;
  delete p.employee;
  db.leaves.push(p);e.target.reset();save();
  alert("Voatahiry ny fangatahana congé.");
};
render();
</script>
</body>
  </html>
